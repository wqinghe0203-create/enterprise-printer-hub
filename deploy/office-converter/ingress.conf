log_format conversion '$status $request_time';

server {
    listen 8080;
    access_log /dev/stdout conversion;
    error_log /dev/null;

    location = /forms/libreoffice/convert {
        if ($request_method != POST) { return 405; }
        if ($content_length = "") { return 411; }
        client_max_body_size 26214656;
        client_body_timeout 15s;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 97s;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass_request_headers off;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        # Resolve through Docker DNS after converter restarts.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $converter http://office-converter:3000;
        proxy_pass $converter/forms/libreoffice/convert;
    }

    location / { return 404; }
}
